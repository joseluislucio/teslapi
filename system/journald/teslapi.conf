# Log persistente en /data (bind sobre /var/log/journal) para poder diagnosticar un corte de
# corriente o de Wi-Fi DESPUÉS de que el coche corte el USB. Tope pequeño y volcado frecuente
# para gastar poco la tarjeta; un corte pierde como mucho los últimos SyncIntervalSec.
[Journal]
Storage=persistent
SystemMaxUse=16M
SystemKeepFree=512M
SyncIntervalSec=30s
MaxLevelStore=info
RateLimitIntervalSec=30s
RateLimitBurst=200
