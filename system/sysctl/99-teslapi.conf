# Lo que el coche escribe pasa por la caché de página antes de llegar a cam_disk.bin.
# Un corte de corriente pierde lo que aún esté sin volcar: se acorta esa ventana de 30 s
# a unos 5 s y se limita a 32 MiB (unos 2 s de grabación a pleno ritmo). Los *_bytes
# anulan los *_ratio por defecto.
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100
vm.dirty_background_bytes = 8388608
vm.dirty_bytes = 33554432
