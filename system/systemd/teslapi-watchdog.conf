# Watchdog de hardware (bcm2835): si systemd deja de acariciarlo por un cuelgue total
# del kernel o del chip Wi-Fi, la Pi se reinicia sola en vez de quedar congelada
# hasta que el coche corte el USB. systemd lo acaricia cada mitad del plazo.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
WatchdogDevice=/dev/watchdog
