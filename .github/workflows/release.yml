name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          (cd web && npm ci && npm run build)
          mkdir -p dist
          (cd daemon && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/teslapid ./cmd/teslapid)
          tar -czf "dist/teslapi-${GITHUB_REF_NAME}-linux-arm64.tar.gz" -C dist teslapid -C .. system setup LICENSE THIRD_PARTY_NOTICES.md
          (cd dist && rm teslapid && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
